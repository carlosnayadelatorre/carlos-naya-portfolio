ervices</text><rect x="510" y="320" width="130" height="58" fill="#fff" stroke="#d8dfe9"/><text x="522" y="355" class="detail">Proposal lines</text><rect x="678" y="320" width="130" height="58" fill="#fff" stroke="#d8dfe9"/><text x="690" y="355" class="detail">Tasks</text><path class="wire" d="M472 264h35M640 264h35M743 293v24M472 349h35"/><rect x="882" y="175" width="270" height="245" fill="#f3f5fa" stroke="#d8dfe9"/><text x="905" y="210" class="label">DOCUMENT PREPARATION</text><text x="905" y="256" class="node">Google Doc + PDF</text><text x="905" y="292" class="detail">Financial reconciliation</text><text x="905" y="327" class="detail">Revision traceability</text><text x="905" y="362" class="detail">Controlled QA verified</text><path class="wire" d="M268 285h47M832 285h47M1017 420v45H600v25"/><rect x="318" y="490" width="834" height="91" fill="#eef0ff" stroke="#bac3ff"/><text x="342" y="528" class="label">PROFESSIONAL REVIEW</text><text x="342" y="558" class="node">Content, commercial details and release decision</text><text x="48" y="612" class="label">Architecture redrawn from existing project records. No client records or account identifiers.</text></svg>