<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>HypeSplice technical architecture</title><desc>n8n discovery and evaluation passes a structured job to local media processing, output validation and human review. This map is reconstructed from existing implementation records, not a live-run screenshot.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6b7697" stroke-width="1.2"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#181b22}.label{font-family:monospace;font-size:13px;letter-spacing:1px;fill:#58617a}.node{font-size:20px}.detail{font-size:16px;fill:#5b606c}.wire{fill:none;stroke:#6b7697;stroke-width:1.5;marker-end:url(#a)}</style><rect width="1200" height="640" fill="#fff"/><text x="48" y="48" class="label">HYPESPLICE / TECHNICAL ARCHITECTURE</text><text x="48" y="101" font-size="34">Orchestration to verifiable outputs.</text><rect x="48" y="160" width="1104" height="188" fill="#f4f5fa" stroke="#d8dfe9"/><text x="72" y="192" class="label">n8n / WORKFLOW ORCHESTRATION</text><rect x="72" y="220" width="328" height="94" fill="#fff" stroke="#d8dfe9"/><text x="92" y="258" class="node">Discover inputs</text><text x="92" y="288" class="detail">Collect and structure</text><rect x="436" y="220" width="328" height="94" fill="#fff" stroke="#d8dfe9"/><text x="456" y="258" class="node">Evaluate</text><text x="456" y="288" class="detail">AI-assisted assessment</text><rect x="800" y="220" width="328" height="94" fill="#fff" stroke="#d8dfe9"/><text x="820" y="258" class="node">Create job</text><text x="820" y="288" class="detail">Structured processing request</text><path class="wire" d="M400 268h33M764 268h33M964 314v70"/><rect x="72" y="388" width="328" height="128" fill="#eef0ff" stroke="#bac3ff"/><text x="92" y="427" class="node">Review gate</text><text x="92" y="462" class="detail">Editorial approval</text><text x="92" y="490" class="detail">Publication remains separate</text><rect x="436" y="388" width="328" height="128" fill="#eef0ff" stroke="#bac3ff"/><text x="456" y="427" class="node">Validate output</text><text x="456" y="462" class="detail">Decode / format / hash</text><text x="456" y="490" class="detail">Traceable processing receipt</text><rect x="800" y="388" width="328" height="128" fill="#eef0ff" stroke="#bac3ff"/><text x="820" y="427" class="node">Local media worker</text><text x="820" y="462" class="detail">Python / FFmpeg / Whisper</text><text x="820" y="490" class="detail">Render the processing job</text><path class="wire" d="M800 452h-33M436 452h-33"/><text x="48" y="568" class="label">VERIFIED COMPONENT EVIDENCE</text><text x="48" y="604" class="detail">Worker integration + replay reuse  /  Separate 5-export synthetic batch: full decode PASS</text></svg>