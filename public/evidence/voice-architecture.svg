<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>Voice agents / appointment automation</title><desc>Original architecture diagram based on verified implementation. Not a live execution screenshot.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6b7697" stroke-width="1.2"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#181b22}.label{font-family:monospace;font-size:13px;letter-spacing:1px;fill:#58617a}.node{font-size:23px}.detail{font-size:17px;fill:#5b606c}.wire{fill:none;stroke:#6b7697;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="1200" height="640" fill="white"/><text x="48" y="48" class="label">VOICE AGENTS / APPOINTMENT AUTOMATION</text><text x="48" y="105" font-size="34">A conversation. A verified action.</text><rect x="48" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="70" y="210" class="node">Understand speech</text><text x="70" y="247" class="detail">Vapi / Soniox / GPT-5 mini</text><text x="70" y="276" class="detail">Fictional English caller</text><path class="wire" d="M392 238h33"/><rect x="428" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="450" y="210" class="node">Retrieve service details</text><text x="450" y="247" class="detail">Structured tool requests</text><text x="450" y="276" class="detail">Prices / 60-minute duration</text><path class="wire" d="M772 238h33"/><rect x="808" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="830" y="210" class="node">Check availability</text><text x="830" y="247" class="detail">Google Calendar / n8n</text><text x="830" y="276" class="detail">Europe/Zurich business hours</text><rect x="48" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="70" y="398" class="node">Obtain confirmation</text><text x="70" y="435" class="detail">Read back exact details</text><text x="70" y="464" class="detail">A new explicit yes is required</text><path class="wire" d="M392 426h33"/><rect x="428" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="450" y="398" class="node">Validate and book</text><text x="450" y="435" class="detail">Recheck / deterministic ID</text><text x="450" y="464" class="detail">Private synthetic calendar</text><path class="wire" d="M772 426h33"/><rect x="808" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="830" y="398" class="node">Verify and respond</text><text x="830" y="435" class="detail">Confirmed event and time</text><text x="830" y="464" class="detail">No email or SMS is sent</text><path class="wire" d="M1100 308v25H28v94h17"/><text x="48" y="559" class="label">VERIFIED IMPLEMENTATION / SYNTHETIC DATA</text><text x="48" y="600" class="detail">Actual audio simulation + independent calendar verification. Tools disabled after controlled tests.</text></svg>