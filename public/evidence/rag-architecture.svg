<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>Document intelligence / RAG</title><desc>Original architecture diagram based on verified implementation. Not a live execution screenshot.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#6b7697" stroke-width="1.2"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#181b22}.label{font-family:monospace;font-size:13px;letter-spacing:1px;fill:#58617a}.node{font-size:23px}.detail{font-size:17px;fill:#5b606c}.wire{fill:none;stroke:#6b7697;stroke-width:1.5;marker-end:url(#arrow)}</style><rect width="1200" height="640" fill="white"/><text x="48" y="48" class="label">DOCUMENT INTELLIGENCE / RAG</text><text x="48" y="105" font-size="34">Answers connected to their evidence.</text><rect x="48" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="70" y="210" class="node">Read PDFs</text><text x="70" y="247" class="detail">Extract actual PDF text</text><text x="70" y="276" class="detail">Two fictional documents</text><path class="wire" d="M392 238h33"/><rect x="428" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="450" y="210" class="node">Preserve provenance</text><text x="450" y="247" class="detail">Clean and chunk text</text><text x="450" y="276" class="detail">300 chars / 50 overlap</text><path class="wire" d="M772 238h33"/><rect x="808" y="168" width="344" height="140" fill="#f4f5fa" stroke="#d8dfe9"/><text x="830" y="210" class="node">Create embeddings</text><text x="830" y="247" class="detail">Gemini Embedding 2</text><text x="830" y="276" class="detail">Three indexed chunks</text><rect x="48" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="70" y="398" class="node">Retrieve evidence</text><text x="70" y="435" class="detail">In-memory vector search</text><text x="70" y="464" class="detail">Matching query embeddings</text><path class="wire" d="M392 426h33"/><rect x="428" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="450" y="398" class="node">Generate an answer</text><text x="450" y="435" class="detail">GPT-5 mini / citations</text><text x="450" y="464" class="detail">Abstain when unsupported</text><path class="wire" d="M772 426h33"/><rect x="808" y="356" width="344" height="140" fill="#eef0ff" stroke="#d8dfe9"/><text x="830" y="398" class="node">Verify the output</text><text x="830" y="435" class="detail">5 of 5 acceptance cases</text><text x="830" y="464" class="detail">Successful tool retrieval</text><path class="wire" d="M1100 308v25H28v94h17"/><text x="48" y="559" class="label">VERIFIED IMPLEMENTATION / SYNTHETIC DATA</text><text x="48" y="600" class="detail">Small controlled test set. Transient index. No confidential documents or public chat endpoint.</text></svg>